    name: mcp-debugger
    transport: stdio
    args:
    - -y
    - '@debugmcp/mcp-debugger'
    - stdio
    registry: false
    command: npx
  microsoft-learn:
    name: microsoft-learn
    transport: http
    registry: false
    url: https://learn.microsoft.com/api/mcp
  roslyn-codelens-mcp:
    name: roslyn-codelens-mcp
    transport: stdio
    args:
    - RoslynCodeLens.Mcp
    - --yes
    registry: false
    command: dnx
  roslyn-mcp:
    name: roslyn-mcp
    transport: stdio
    args:
    - RoslynMcp.Server
    registry: false
    command: dnx
