mcp_configs:
  aspire:
    name: aspire
    transport: stdio
    args:
    - Aspire.Cli dashboard run --allow-anonymous
    registry: false
    command: dnx
  avalonia:
    name: avalonia
    transport: http
    registry: false
    url: http://127.0.0.1:5599
