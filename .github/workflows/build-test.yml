name: Build Test

on:
  workflow_call:

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
            path: ~/.nuget/packages
            key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', 'global.json') }}
            restore-keys: |
              ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build --configuration Release --tl:off -clp:ErrorsOnly

      - name: Test
        env:
          DOTNET_CreateDumpDiagnostics: "1"
        run: |
          # Temporary diagnostic: remove the kernel fallback after this run.
          mkdir -p TestResults
          # Include CLR/JIT mappings in Linux system cores so dotnet-dump/SOS
          # can recover managed state (the documented minimum is 0x3f).
          echo "coredump_filter before: $(cat /proc/self/coredump_filter)"
          printf '0x3f\n' > /proc/self/coredump_filter
          coredump_filter="$(cat /proc/self/coredump_filter)"
          echo "coredump_filter inherited by children: ${coredump_filter}"
          test "${coredump_filter}" = "0000003f"
          ulimit -c unlimited
          sudo sysctl -w "kernel.core_pattern=${{ github.workspace }}/TestResults/core-%e-%p-%t.dmp"

          dotnet test \
            --configuration Release \
            --no-build \
            --diagnostic \
            --diagnostic-synchronous-write

      - name: Upload test diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics
          path: TestResults/
          retention-days: 3
          compression-level: 1

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: (!cancelled())
        with:
          name: KubeUI Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Test Summary
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          check_name: KubeUI Tests
          comment_mode: always
          files: TestResults/*.trx

      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: TestResults/*.cobertura.xml
          fail_ci_if_error: false

  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build documentation website
        working-directory: website
        run: npm run build

      - name: Upload Website
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: website/build/
