name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'alpha'
      - 'beta'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

permissions:
  id-token: write
  contents: write
  actions: write
  checks: write
  issues: write
  pull-requests: write

jobs:
  publish-docs:
    if: github.ref == 'refs/heads/main'
    name: Publish Documentation
    uses: $/.github/workflows/build-website.yml
    with:
      publish_pages: true
    permissions:
      contents: read
      pages: write
      id-token: write

  build-test:
    name: Build & Test
    uses: ./.github/workflows/build-test.yml

  semantic-release:
    name: Bump Version
    needs: [build-test]
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ (steps.semantic.outputs.new_release_published && steps.semantic.outputs.new_release_version) || '0.0.1-alpha.1' }}
      new_release_notes: ${{ steps.semantic.outputs.new_release_notes }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Semantic Release
      uses: cycjimmy/semantic-release-action@v8.1.4
      id: semantic
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        dry_run: true
        extra_plugins: |
          @semantic-release/github@12.0.10
          conventional-changelog-conventionalcommits@9

  publish-matrix:
    name: Publish Installers
    needs: [semantic-release]
    uses: ./.github/workflows/publish-installer.yml
    secrets: inherit
    with:
      package_version: ${{ needs.semantic-release.outputs.new_release_version }}
      release_notes: ${{ needs.semantic-release.outputs.new_release_notes }}
      download_releases: ${{ needs.semantic-release.outputs.new_release_published == 'true' }}
      enable_code_signing: true

  release:
    if: needs.semantic-release.outputs.new_release_published == 'true'
    name: Create Release
    needs: [semantic-release, publish-matrix]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: dist/

    - name: Clean Dist
      shell: pwsh
      run: |
        Remove-Item -Path dist/website -Recurse -Force

    - name: Semantic Release
      uses: cycjimmy/semantic-release-action@v8.1.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        dry_run: false
        extra_plugins: |
          @semantic-release/github@12.0.10
          conventional-changelog-conventionalcommits@9
