name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'alpha'
      - 'beta'

permissions:
  id-token: write
  contents: write
  actions: write
  checks: write
  issues: write
  pull-requests: write

jobs:
  publish-docs:
    if: github.ref == 'refs/heads/main'
    name: Publish Documentation
    needs: []
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-test:
    name: Build & Test
    needs: []
    uses: ./.github/workflows/build-test.yml

  semantic-release:
    name: Bump Version
    needs: [build-test]
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ (steps.semantic.outputs.new_release_published && steps.semantic.outputs.new_release_version) || '0.0.1-alpha.1' }}
      new_release_notes: ${{ steps.semantic.outputs.new_release_notes }}
    steps:
    - uses: actions/checkout@v7

    - name: Semantic Release
      uses: cycjimmy/semantic-release-action@v6.0.0
      id: semantic
      with:
        dry_run: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-matrix:
    name: Publish Installers
    needs: [semantic-release]
    uses: ./.github/workflows/publish-installer.yml
    secrets: inherit
    with:
      package_version: ${{ needs.semantic-release.outputs.new_release_version }}
      release_notes: ${{ needs.semantic-release.outputs.new_release_notes }}
      download_releases: ${{ needs.semantic-release.outputs.new_release_published == 'true' }}
      enable_code_signing: true

  release:
    if: needs.semantic-release.outputs.new_release_published == 'true'
    name: Create Release
    needs: [semantic-release, publish-matrix]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist/

    - name: Semantic Release
      uses: cycjimmy/semantic-release-action@v6.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
